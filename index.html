}
.ready-dot,.down-dot {
  width: 6px;
  height: 6px;
  background: #bdd299;
  border-radius: 50%;
  margin-left: auto;
}
.down-dot {
  background: #ec9b7b;
}
.start-button {
  margin-top: 20px;
  font-size: 11px;
}
.leave-button {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 100%;
  font-size: 10px;
  color: #acb99f;
  padding: 17px 0 0;
}
.adventure-status {
  border-top: 1px solid #48563e;
  margin-top: 17px;
  padding-top: 14px;
  display: grid;
  gap: 11px;
}
.adventure-status span {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: #d4dfb6;
}
.error {
  background: #5c332c;
  padding: 11px;
  font-size: 11px;
  line-height: 1.7;
  border-radius: 5px;
  margin-top: 15px;
  color: #ffe0c8;
}
.clear-stars {
  font-size: 34px;
  color: #f4c78f;
  letter-spacing: 12px;
  margin-bottom: 12px;
}
.clear-overlay .primary {
  width: 230px;
  margin-top: 16px;
}
.clear-overlay small {
  margin-top: 12px;
  font-size: 11px;
}
.solo-card {
  padding: 10px;
  text-align: center;
  display: flex;
  align-items: center;
  flex-direction: column;
}
.solo-card>span {
  font: 9px monospace;
  color: #b7c49d;
  margin-top: 19px;
  letter-spacing: .15em;
}
.solo-card h3 {
  font-size: 14px;
  margin: 13px 0;
}
.solo-card p {
  font-size: 10px;
  color: #a9ba9b;
  line-height: 1.9;
}
.solo-stats {
  margin: 15px 0 24px;
  display: grid;
  gap: 13px;
}
.solo-stats>span {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #b6c5a5;
}
.solo-stats b {
  font: 13px monospace;
  color: #ede8ce;
}
.secondary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  background: #364933;
  border: 1px solid #677653;
  border-radius: 5px;
  padding: 12px;
  font-size: 11px;
}
.network-warning {
  position: absolute;
  bottom: 12px;
  left: 10px;
  right: 10px;
  background: #6e3e27ed;
  padding: 10px;
  text-align: center;
  font-size: 11px;
  color: #fff0d1;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #091c15d9;
  backdrop-filter: blur(7px);
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 25px;
}
.help-modal {
  position: relative;
  max-width: 620px;
  max-height: 90vh;
  overflow: auto;
  background: #24392d;
  padding: 36px;
  border: 1px solid #6a7956;
  border-radius: 14px;
  box-shadow: 0 20px 100px #0006;
}
.modal-close {
  position: absolute;
  right: 20px;
  top: 20px;
}
.help-modal h2 {
  font-size: 25px;
  margin: 20px 0;
}
.help-modal p,.help-modal li {
  font-size: 12px;
  color: #c1ceb3;
  line-height: 1.9;
}
.help-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
  align-items: center;
  margin: 23px 0;
  padding: 20px;
  background: #1a2d23;
  border-radius: 7px;
}
.help-controls b {
  font-weight: 400;
  font-size: 12px;
}
.help-modal ul {
  padding-left: 17px;
  margin-bottom: 25px;
}
.help-modal li {
  margin: 7px 0;
}
@media (min-width:1500px) {
  .game-title {
    font-size: 65px;
  }
  .room-panel {
    min-height: 607px;
  }
}
@media (max-width:1200px) {
  main {
    padding: 0 28px;
  }
  .workspace {
    grid-template-columns: minmax(0,1fr) 280px;
    gap: 18px;
  }
  .room-panel {
    padding: 20px 18px;
    min-height: 540px;
  }
  .controls {
    flex-wrap: wrap;
  }
  .controls>span {
    display: none;
  }
  .world {
    padding: 15px 10px;
    gap: 8px;
  }
  .world b {
    font-size: 9px;
  }
  .world-end {
    display: none;
  }
  .world-number {
    font-size: 17px;
  }
  .game-title {
    font-size: 4.3vw;
  }
  .title-overlay p {
    margin-bottom: 14px;
  }
  .features {
    gap: 16px;
  }
  .features article {
    gap: 10px;
  }
  .features p {
    font-size: 9px;
  }
  .feature-icon {
    width: 36px;
    height: 36px;
  }
  .intro h1 {
    font-size: 30px;
  }
}
@media (max-width:900px) {
  main {
    padding: 0 20px;
  }
  .workspace {
    grid-template-columns: 1fr;
  }
  .room-panel {
    min-height: 0;
  }
  .intro-note {
    display: none;
  }
  .game-title {
    font-size: 7vw;
  }
  .title-overlay {
    top: 12%;
  }
  .room-panel {
    padding: 25px;
  }
  .features {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .controls {
    flex-wrap: nowrap;
  }
  .controls>span {
    display: flex;
  }
  .panel-bottom {
    margin-top: 20px;
  }
  .room-panel h2 {
    margin-top: 14px;
  }
  .members {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .game-screen {
    min-height: 0;
  }
  footer p {
    display: none;
  }
}
@media (max-width:560px) {
  main {
    padding: 0 12px;
  }
  .topbar {
    height: 80px;
  }
  .brand {
    font-size: 15px;
    gap: 8px;
  }
  .brand-cat {
    width: 38px;
    height: 42px;
  }
  .online-label {
    display: none;
  }
  .intro {
    padding: 27px 0;
  }
  .intro h1 {
    font-size: 25px;
  }
  .intro p {
    font-size: 10px;
  }
  .mobile-br {
    display: block;
  }
  .game-title {
    font-size: 7.5vw;
    margin: 8px 0;
  }
  .game-title b {
    right: -35px;
    -webkit-text-stroke: 1px #3b5744;
  }
  .pixel-label {
    font-size: 6px;
    padding: 4px;
  }
  .title-overlay p {
    font-size: 9px;
    margin-bottom: 10px;
  }
  .scene-hint {
    font-size: 7px;
  }
  .world {
    padding: 12px 7px;
    gap: 6px;
  }
  .world small {
    font-size: 6px;
  }
  .world b {
    font-size: 8px;
  }
  .world-number {
    font-size: 13px;
  }
  .controls {
    padding: 10px;
    gap: 3px;
  }
  .controls>span,.controls button {
    display: none;
  }
  .controls>div {
    margin: auto;
    gap: 2px;
  }
  .controls em {
    margin-right: 4px;
    font-size: 8px;
  }
  kbd {
    font-size: 8px;
    min-width: 19px;
    min-height: 21px;
    padding: 3px;
  }
  .center-overlay h2 {
    font-size: 18px;
    margin: 8px 0;
  }
  .center-overlay p {
    font-size: 9px;
  }
  .overlay-icon {
    display: none;
  }
  .lobby-cats {
    margin-top: 10px;
  }
  .lobby-cats svg {
    width: 30px;
    height: 30px;
  }
  .clear-stars {
    font-size: 21px;
    margin-bottom: 5px;
  }
  .center-overlay .eyebrow {
    font-size: 8px;
  }
  .clear-overlay .primary {
    min-height: 35px;
    font-size: 10px;
    margin-top: 5px;
  }
  .help-modal {
    padding: 27px 20px;
  }
  .help-modal h2 {
    font-size: 20px;
  }
  .help-controls {
    padding: 12px;
  }
  .help-controls b {
    font-size: 10px;
  }
}
.connection-note {
  font-size: 9px;
  line-height: 1.7;
  color: #a6b399;
  margin-top: 16px;
}
.panel-bottom {
  margin-top: 18px;
}
